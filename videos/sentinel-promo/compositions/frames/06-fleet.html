  <script>
    (function () {
      window.__timelines = window.__timelines || {};

      var tl = gsap.timeline({ paused: true });

      // ---- Scene 1 (0.0-2.0s): cream ground; header + pill enter first, top band ----
      tl.fromTo(
        '[id="f06-fleet-card"]',
        { opacity: 0, scale: 0.97 },
        { opacity: 1, scale: 1, duration: 0.4, ease: "power3.out" },
        0.0
      );
      tl.fromTo(
        '[id="f06-fleet-h2"]',
        { opacity: 0, y: 16 },
        { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" },
        0.1
      );
      tl.fromTo(
        '[id="f06-fleet-sub"]',
        { opacity: 0, y: 12 },
        { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" },
        0.25
      );
      tl.fromTo(
        '[id="f06-fleet-pill"]',
        { opacity: 0, scale: 0.9 },
        { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(1.4)" },
        0.3
      );

      // ---- Scene 2 (2.0-5.0s): two real rows self-assemble, staggered cascade ~0.6s apart ----
      var EXPAND_DUR = 0.55;
      var STAGGER = 0.05;

      // column header row: simple fade/slide in
      var headCells = document.querySelectorAll("#f06-fleet-colhead .f06-fleet-cell");
      tl.fromTo(
        headCells,
        { opacity: 0, y: 10 },
        { opacity: 1, y: 0, duration: 0.35, ease: "power2.out", stagger: 0.03 },
        2.0
      );

      function assembleRow(rowSel, startAt) {
        var cells = document.querySelectorAll(rowSel + " .f06-fleet-cell");
        var rowCenter = 784; // row-local horizontal center (content width 1568 / 2)
        cells.forEach(function (cell, i) {
          var colStart = parseFloat(cell.style.left) || 0;
          var deltaX = rowCenter - colStart; // shared-origin offset -> final slot
          tl.fromTo(
            cell,
            { x: deltaX, scale: 0.6, opacity: 0 },
            { x: 0, scale: 1, opacity: 1, duration: EXPAND_DUR, ease: "power3.out" },
            startAt + i * STAGGER
          );
        });
      }

      // row 1 "mocksense-0 - Active - CO2" then row 2 "mocksense-1 - Active - H2", ~0.6s apart
      assembleRow('[id="f06-fleet-row1"]', 2.5);
      assembleRow('[id="f06-fleet-row2"]', 3.1);

      // status dot pulse: single expanding ring + fade, fires as each row lands
      function pulseDot(ringSel, atTime) {
        tl.set(ringSel, { transformOrigin: "50% 50%", scale: 1, opacity: 0.9 }, atTime);
        tl.to(
          ringSel,
          { scale: 2.6, opacity: 0, duration: 0.5, ease: "power2.out", immediateRender: false },
          atTime
        );
      }

      pulseDot('[id="f06-fleet-ring1"]', 3.1);
      pulseDot('[id="f06-fleet-ring2"]', 3.7);

      // ---- Scene 3 (5.0-7.0s): hold on complete two-row table; ghost row fades in, then stills ----
      tl.fromTo(
        '[id="f06-fleet-ghost"]',
        { opacity: 0, y: 10 },
        { opacity: 0.35, y: 0, duration: 0.6, ease: "power2.out" },
        5.4
      );

      window.__timelines["06-fleet"] = tl;
      tl.seek(0);
    })();
  </script>
