  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      window.__timelines = window.__timelines || {};

      // --- setup: measure real stroke geometry for the logo-draw (svg-path-draw) ---
      var drawIds = ["f03-product-intro-outer", "f03-product-intro-inner", "f03-product-intro-ring", "f03-product-intro-stem"];
      drawIds.forEach(function (id) {
        var el = document.getElementById(id);
        var len = el.getTotalLength();
        el.style.strokeDasharray = String(len);
        el.style.strokeDashoffset = String(len);
      });

      var tl = gsap.timeline({ paused: true });

      // ================= Scene 1 (0.0-1.8s): scattered nodes + lines fade in, sparse/asymmetric =================
      tl.to(".f03-product-intro-glow", { opacity: 1, duration: 1.0, ease: "power1.out" }, 0.0);

      var lineIds = ["#f03-product-intro-line-1", "#f03-product-intro-line-2", "#f03-product-intro-line-3", "#f03-product-intro-line-4"];
      lineIds.forEach(function (sel, i) {
        tl.fromTo(sel, { opacity: 0 }, { opacity: 0.18, duration: 0.6, ease: "power1.out" }, 0.15 + i * 0.1);
      });

      var nodes = gsap.utils.toArray(".f03-product-intro-node");
      var ENTRY_AT = 0.1;
      var ENTRY_STAGGER = 0.09;
      var EXPAND_DUR = 0.9;
      nodes.forEach(function (el, i) {
        tl.fromTo(
          el,
          { xPercent: -50, yPercent: -50, x: 0, y: 0, scale: 0.4, opacity: 0 },
          {
            x: Number(el.dataset.targetX),
            y: Number(el.dataset.targetY),
            scale: 1,
            opacity: 0.85,
            duration: EXPAND_DUR,
            ease: "power3.out",
          },
          ENTRY_AT + i * ENTRY_STAGGER
        );
      });

      // ================= Scene 2 (1.8-4.5s): convergence + logo self-draw, ~35% of frame =================
      lineIds.forEach(function (sel) {
        tl.to(sel, { opacity: 0, duration: 0.3, ease: "power1.out" }, 1.8);
      });

      // scattered nodes run the center-outward-expansion recipe IN REVERSE: they collapse
      // from their scattered positions back onto the shared center, absorbed into the mark.
      var CONVERGE_AT = 1.85;
      var CONVERGE_STAGGER = 0.07;
      var CONVERGE_DUR = 0.85;
      nodes.forEach(function (el, i) {
        tl.to(
          el,
          { x: 0, y: 0, scale: 0.3, opacity: 0, duration: CONVERGE_DUR, ease: "power3.out" },
          CONVERGE_AT + i * CONVERGE_STAGGER
        );
      });

      // the real shield outline draws on, stroke by stroke (svg-path-draw)
      var SEG1_START = 2.7; // outer outline
      var SEG1_DUR = 0.55;
      tl.to("#f03-product-intro-outer", { strokeDashoffset: 0, duration: SEG1_DUR, ease: "power2.out" }, SEG1_START);

      var SEG2_START = SEG1_START + SEG1_DUR * 0.75; // inner shield outline
      var SEG2_DUR = 0.55;
      tl.to("#f03-product-intro-inner", { strokeDashoffset: 0, duration: SEG2_DUR, ease: "power2.out" }, SEG2_START);
      tl.to("#f03-product-intro-inner", { fillOpacity: 1, duration: 0.35, ease: "power1.out" }, SEG2_START + SEG2_DUR);

      var SEG3_START = SEG2_START + SEG2_DUR * 0.75; // sensor ring
      var SEG3_DUR = 0.45;
      tl.to("#f03-product-intro-ring", { strokeDashoffset: 0, duration: SEG3_DUR, ease: "power2.out" }, SEG3_START);

      var LOCK_AT = SEG3_START + SEG3_DUR * 0.9; // the sensor dot + stem "lock" the mark
      tl.fromTo(
        "#f03-product-intro-center-dot",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.3, ease: "back.out(2.2)" },
        LOCK_AT
      );
      tl.to("#f03-product-intro-stem", { strokeDashoffset: 0, duration: 0.3, ease: "power2.out" }, LOCK_AT);

      // soft impact settle on the whole mark as it locks
      tl.fromTo(
        "#f03-product-intro-mark-wrap",
        { scale: 1 },
        { scale: 1.045, duration: 0.1, ease: "power2.out" },
        LOCK_AT + 0.12
      ).to("#f03-product-intro-mark-wrap", { scale: 1, duration: 0.15, ease: "power2.out" }, LOCK_AT + 0.22);

      // ================= Scene 3 (4.5-6.0s): wordmark locks in, tagline settles beneath, holds =================
      var letters = gsap.utils.toArray(".f03-product-intro-letter");
      var LETTER_AT = 4.5;
      var LETTER_STAGGER = 0.045;
      var LETTER_DUR = 0.45;
      letters.forEach(function (el, i) {
        tl.fromTo(
          el,
          { y: 26, opacity: 0 },
          { y: 0, opacity: 1, duration: LETTER_DUR, ease: "power4.out" },
          LETTER_AT + i * LETTER_STAGGER
        );
      });

      // "is always watching." — per-word staggered reveal on a smooth long-tail settle
      var words = gsap.utils.toArray(".f03-product-intro-word");
      var TAGLINE_AT = 4.95;
      var TAGLINE_STAGGER = 0.11;
      var TAGLINE_DUR = 0.65;
      words.forEach(function (el, i) {
        tl.fromTo(
          el,
          { y: 18, opacity: 0 },
          { y: 0, opacity: 1, duration: TAGLINE_DUR, ease: "power4.out" },
          TAGLINE_AT + i * TAGLINE_STAGGER
        );
      });

      // held read with a near-imperceptible continuous life-in-the-hold (no repeat/yoyo)
      tl.fromTo(
        "#f03-product-intro-mark-wrap",
        { scale: 1 },
        { scale: 1.006, duration: 0.15, ease: "none" },
        5.85
      );

      window.__timelines["03-product-intro"] = tl;
      tl.seek(0);
    })();
  </script>
