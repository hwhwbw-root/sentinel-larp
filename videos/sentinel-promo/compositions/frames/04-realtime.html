      var PULSE_CYCLES = 5;
      var PULSE_DOT_AMP = 0.12;
      var PULSE_RING_AMP = 0.08;
      var PULSE_RING_OPACITY_BASE = 0.5;
      var PULSE_RING_OPACITY_AMP = 0.35;

      tl.to(
        pulse,
        {
          p: Math.PI * 2 * PULSE_CYCLES,
          duration: 5.3,
          ease: "none",
          onUpdate: function () {
            var sD = 1 + Math.sin(pulse.p) * PULSE_DOT_AMP;
            var sR = 1 + Math.sin(pulse.p + Math.PI / 2) * PULSE_RING_AMP;
            dot.setAttribute("transform", "translate(20 20) scale(" + sD + ") translate(-20 -20)");
            ring.setAttribute("transform", "translate(20 20) scale(" + sR + ") translate(-20 -20)");
            ring.style.opacity = String(PULSE_RING_OPACITY_BASE + Math.sin(pulse.p) * PULSE_RING_OPACITY_AMP);
          },
        },
        0.6
      );

      window.__timelines["04-realtime"] = tl;
    })();
  </script>
</template>
