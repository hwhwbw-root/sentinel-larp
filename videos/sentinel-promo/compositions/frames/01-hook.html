  <script>
    (function () {
      var lineEl = document.getElementById("f01-hook-line");
      var counterWrap = document.getElementById("f01-hook-counter-wrap");
      var counterEl = document.getElementById("f01-hook-counter");
      var suffixEl = document.getElementById("f01-hook-suffix");
      var unitEl = document.getElementById("f01-hook-unit");
      var pillEl = document.getElementById("f01-hook-pill");
      var tintEl = document.getElementById("f01-hook-tint");

      var COBALT = "#2F6FED";
      var RED = "#dc2626";
      var START_VALUE = 627;
      var END_VALUE = 1686;
      var END_SIZE = 15; // cqw — matches static .f01-hook-counter font-size (30% of frame, per packet)
      var START_SIZE = 6.75; // cqw — ~45% of END_SIZE
      var START_SCALE = START_SIZE / END_SIZE;

      var tl = gsap.timeline({ paused: true });

      // ---- Scene 1 (0.0-3.5s): calm cream ground, one restrained line, held. ----
      // titlecard-reveal signature: single slide-up crossfade move, then a full hold —
      // this is the video's first deliberate breather beat. No tint, no red yet.
      tl.fromTo(
        lineEl,
        { opacity: 0, y: 18 },
        { opacity: 1, y: 0, duration: 0.7, ease: "power2.out" },
        0.3
      );
      // holds still from ~1.0s to 3.5s — no further motion on the line during the hold

      // ---- Scene 2 (3.5-6.0s): soft blur-crossfade clears the line; ground begins ----
      // tinting toward red; the counter (counting-dynamic-scale) seats dead-center,
      // small, reading "627 ppm" in cobalt.
      var CLEAR_AT = 3.5;
      var CLEAR_DUR = 0.6;
      tl.to(
        lineEl,
        { opacity: 0, filter: "blur(14px)", duration: CLEAR_DUR, ease: "power2.in" },
        CLEAR_AT
      );

      var SEAT_AT = 3.7;
      tl.fromTo(
        counterWrap,
        { scale: START_SCALE * 0.001, opacity: 0 },
        { scale: START_SCALE, opacity: 1, duration: 0.5, ease: "power3.out" },
        SEAT_AT
      );

      // ground begins its slow tint shift in step with the counter seating, continuing
      // through Scene 3's climb.
      tl.fromTo(
        tintEl,
        { opacity: 0 },
        { opacity: 0.85, duration: 4.8, ease: "power1.inOut" },
        SEAT_AT
      );

      // ---- Scene 3 (6.0-9.0s): the counter climbs 627 -> 900 -> 1,686, font weight ----
      // growing via transform scale (counting-dynamic-scale), color interpolating
      // cobalt -> red as it crosses the danger line; locks, then the DANGEROUS pill
      // spring-pops in and holds with a subtle jitter.
      var COUNT_AT = 6.0;
      var COUNT_DUR = 1.7;
      var COUNT_EASE = "power3.out";

      var state = { value: START_VALUE };
      tl.to(
        state,
        {
          value: END_VALUE,
          duration: COUNT_DUR,
          ease: COUNT_EASE,
          onUpdate: function () {
            counterEl.textContent = Math.round(state.value).toLocaleString();
          },
        },
        COUNT_AT
      );

      tl.fromTo(
        counterWrap,
        { scale: START_SCALE },
        { scale: 1, duration: COUNT_DUR, ease: COUNT_EASE },
        COUNT_AT
      );

      tl.fromTo(
        [counterEl, suffixEl],
        { color: COBALT },
        { color: RED, duration: COUNT_DUR, ease: COUNT_EASE },
        COUNT_AT
      );

      tl.to(suffixEl, { opacity: 0, duration: 0.2, ease: "power2.out" }, COUNT_AT + COUNT_DUR - 0.1);
