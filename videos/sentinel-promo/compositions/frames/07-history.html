  <script>
    (function () {
      window.__timelines = window.__timelines || {};

      var tl = gsap.timeline({ paused: true });

      // ---- Scene 1 (0.0-1.5s): cream ground; header + device/date selector enter, top band only ----
      tl.fromTo(
        '[id="f07-history-card"]',
        { opacity: 0, scale: 0.97 },
        { opacity: 1, scale: 1, duration: 0.4, ease: "power3.out" },
        0.0
      );
      tl.fromTo(
        document.getElementById("f07-history-h2"),
        { opacity: 0, y: 16 },
        { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" },
        0.05
      );
      tl.fromTo(
        document.getElementById("f07-history-sub"),
        { opacity: 0, y: 12 },
        { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" },
        0.2
      );
      tl.fromTo(
        '[id="f07-history-pill-device"]',
        { opacity: 0, scale: 0.9 },
        { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(1.4)" },
        0.25
      );
      tl.fromTo(
        '[id="f07-history-pill-date"]',
        { opacity: 0, scale: 0.9 },
        { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(1.4)" },
        0.33
      );

      // table chrome settles in at the tail of scene 1
      tl.fromTo(
        document.getElementById("f07-history-eyebrow"),
        { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.25, ease: "power2.out" },
        0.55
      );
      var headCells = document.querySelectorAll("#f07-history-colhead .f07-history-cell");
      tl.fromTo(
        headCells,
        { opacity: 0, y: 10 },
        { opacity: 1, y: 0, duration: 0.3, ease: "power2.out", stagger: 0.03 },
        0.7
      );

      // waterfall cascade: the visible rows whip in (binary opacity, power4.out, overlapping)
      // before the scroll takes over — per blueprint Scene 1 tail
      (function cascadeRows() {
        var F = 1 / 60;
        var ids = [
          "f07-history-row0", "f07-history-row1", "f07-history-row2", "f07-history-row3",
          "f07-history-row4", "f07-history-row5", "f07-history-row6", "f07-history-row7"
        ];
        var t = 0.85;
        var dur = 0.15;
        ids.forEach(function (id) {
          var el = document.getElementById(id);
          tl.set(el, { opacity: 1, y: 34 }, t);
          tl.to(el, { y: 0, duration: dur, ease: "power4.out" }, t);
          t = t + dur - F;
        });
      })();

      // ---- Scene 2 (1.5-4.2s): the table traverses vertically at read pace; ----
      // the spike row flashes cobalt -> red briefly as it crosses center.
      var SCROLL_AT = 1.9;
      var SCROLL_DUR = 1.9;
      var SCROLL_DISTANCE = 240; // measured: 12 rows * 60px - 480px viewport
      tl.to(
        '[id="f07-history-rows-world"]',
        { y: -SCROLL_DISTANCE, duration: SCROLL_DUR, ease: "power3.out" },
        SCROLL_AT
      );

      var FLASH_AT = 2.75;
      tl.to(
        '[id="f07-history-row5"]',
        { backgroundColor: "rgba(47, 111, 237, 0.12)", borderLeftColor: "#2F6FED", duration: 0.14, ease: "power1.inOut" },
        FLASH_AT
      );
      tl.to(
        '[id="f07-history-spike-value"]',
        { color: "#2F6FED", scale: 1.06, duration: 0.14, ease: "power1.inOut" },
        FLASH_AT
      );
      tl.to(
        '[id="f07-history-row5"]',
        { backgroundColor: "rgba(220, 38, 38, 0.12)", borderLeftColor: "#dc2626", duration: 0.18, ease: "power1.inOut" },
        FLASH_AT + 0.14
      );
      tl.to(
        '[id="f07-history-spike-value"]',
        { color: "#dc2626", scale: 1, duration: 0.18, ease: "power1.inOut" },
        FLASH_AT + 0.14
      );
      tl.fromTo(
        '[id="f07-history-spike-tag"]',
        { opacity: 0, scale: 0.001 },
        { opacity: 1, scale: 1, duration: 0.3, ease: "power3.out" },
        FLASH_AT + 0.2
      );

      // ---- Scene 3 (4.2-6.0s): the table pivots via a scale-swap handoff into ----
      // the Export CSV button, which spring-pops in and holds.
      tl.to(
        '[id="f07-history-table-body"]',
        { opacity: 0, scale: 0.9, filter: "blur(8px)", duration: 0.45, ease: "power2.in" },
        4.2
      );
      tl.fromTo(
        '[id="f07-history-export-wrap"]',
        { opacity: 0, scale: 0.001 },
        { opacity: 1, scale: 1, duration: 0.5, ease: "power3.out" },
        4.35
      );

      window.__timelines["07-history"] = tl;

    })();
