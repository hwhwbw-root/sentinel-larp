<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 220" width="1080" height="440">
    <defs>
      <filter id="cardShadow2" x="-10%" y="-10%" width="120%" height="130%">
        <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#0f172a" flood-opacity="0.08" />
      </filter>
    </defs>
    <g transform="translate(20, 15)" filter="url(#cardShadow2)">
      <!-- Temp Sub-Card -->
      <g transform="translate(0, 0)">
        <rect width="242" height="190" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2" />
        <path d="M16 0 H226 Q242 0 242 16 V26 H0 V16 Q0 0 16 0 Z" fill="#f8fafc" />
        <text x="18" y="17" font-family="Arial, Helvetica, 'Segoe UI', sans-serif" font-weight="700" font-size="10" fill="#71717a" letter-spacing="0.5">TEMPERATURE</text>
        <g transform="translate(20, 56)">
          <text x="0" y="14" font-family="Arial, Helvetica, 'Segoe UI', sans-serif" font-weight="600" font-size="12" fill="#71717a">AMBIENT</text>
          <text x="0" y="58" font-family="Arial, Helvetica, 'Segoe UI', sans-serif" font-weight="800" font-size="38" fill="#18181b">24.4°C</text>
          <g transform="translate(0, 72)">
            <rect width="84" height="22" rx="11" fill="#eff6ff" />
            <text x="42" y="15" font-family="Arial, Helvetica, 'Segoe UI', sans-serif" font-weight="700" font-size="10" fill="#2f6fed" text-anchor="middle">OPTIMAL</text>
          </g>
          <text x="0" y="114" font-family="Arial, Helvetica, 'Segoe UI', sans-serif" font-weight="600" font-size="11" fill="#71717a">Target 22–25°C</text>
        </g>
      </g>

      <!-- Humidity Sub-Card -->
      <g transform="translate(258, 0)">
        <rect width="242" height="190" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2" />
        <path d="M16 0 H226 Q242 0 242 16 V26 H0 V16 Q0 0 16 0 Z" fill="#f8fafc" />
        <text x="18" y="17" font-family="Arial, Helvetica, 'Segoe UI', sans-serif" font-weight="700" font-size="10" fill="#71717a" letter-spacing="0.5">HUMIDITY</text>
        <g transform="translate(20, 56)">
          <text x="0" y="14" font-family="Arial, Helvetica, 'Segoe UI', sans-serif" font-weight="600" font-size="12" fill="#71717a">RELATIVE RH</text>
          <text x="0" y="58" font-family="Arial, Helvetica, 'Segoe UI', sans-serif" font-weight="800" font-size="38" fill="#18181b">48.1%</text>
          <g transform="translate(0, 72)">
            <rect width="84" height="22" rx="11" fill="#dcfce7" />
            <text x="42" y="15" font-family="Arial, Helvetica, 'Segoe UI', sans-serif" font-weight="700" font-size="10" fill="#16a34a" text-anchor="middle">COMFORT</text>
          </g>
          <text x="0" y="114" font-family="Arial, Helvetica, 'Segoe UI', sans-serif" font-weight="600" font-size="11" fill="#71717a">Safe Range 40–60%</text>
        </g>
      </g>
    </g>
  </svg>