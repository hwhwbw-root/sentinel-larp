<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 850" width="600" height="850">
  <defs>
    <filter id="soft-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.08" />
    </filter>
  </defs>

  
  <!-- Top Fold Flap Guide -->
  <polygon points="30,80 30,10 570,10 570,80" fill="#ffffff" opacity="0.85" />
  <line x1="30" y1="80" x2="570" y2="80" stroke="#a1a1aa" stroke-width="2" stroke-dasharray="6,6" opacity="0.7" />
  <!-- Punch Hole Guides -->
  <circle cx="70" cy="45" r="12" fill="none" stroke="#a1a1aa" stroke-width="2" stroke-dasharray="3,3" />
  <circle cx="530" cy="45" r="12" fill="none" stroke="#a1a1aa" stroke-width="2" stroke-dasharray="3,3" />
  <text x="300" y="50" font-family="Arial, sans-serif" font-size="12" fill="#a1a1aa" text-anchor="middle" letter-spacing="1">FOLD FLAP OVER STRING</text>
  

  <!-- Triangle Pennant Body -->
  <polygon points="30,80 570,80 300,820" fill="#ffffff" stroke="#e4e4e7" stroke-width="2" filter="url(#soft-shadow)" />

  <!-- Accent top bar on flag -->
  <line x1="50" y1="95" x2="550" y2="95" stroke="#2f6fed" stroke-width="3" opacity="0.3" stroke-linecap="round" />

  <!-- Flag Content -->
  
    <g transform="translate(180, 230) scale(3)">
      <path d="M40 4 L72 16 V38 C72 58 58 71 40 76 C22 71 8 58 8 38 V16 Z"
            fill="none" stroke="#2f6fed" stroke-width="4" stroke-linejoin="round" />
      <path d="M40 14 L64 23 V38 C64 53.5 53.5 63.5 40 67.5 C26.5 63.5 16 53.5 16 38 V23 Z"
            fill="#f0f5ff" stroke="#2f6fed" stroke-width="2" />
      <circle cx="40" cy="36" r="9" fill="none" stroke="#2f6fed" stroke-width="3.5" />
      <circle cx="40" cy="36" r="2.6" fill="#2f6fed" />
      <path d="M40 47 V56" stroke="#2f6fed" stroke-width="3.5" stroke-linecap="round" />
    </g>
</svg>